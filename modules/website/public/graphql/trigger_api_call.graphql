---
metadata: {
    graphql_name: "trigger_api_call"
}
---
mutation trigger_api_call($name: String!, $data:HashObject) {
  items: api_call_send(
      template: {
          name: $name
      },
      data: $data
  ) {
      response {
          body
          headers
          status
      },
      errors {
          message
      }
  }
}