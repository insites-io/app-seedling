---
metadata: {
    graphql_name: "get_documentations"
}
---
# Purpose: Fetches paginated documentation records for display in dashboard
# Used by: modules/dashboard/public/views/pages/dashboard.liquid
# Parameters:
#   - $page: Page number (default: 1)
#   - $size: Records per page (default: 10)
# Returns: Paginated list of enabled documentation records with images, sorted by sort_order
query get_documentations(
    $page: Int = 1, 
    $size: Int = 10,
) {
    items: records(
        page: $page
        per_page: $size
        filter: {
            table: { value: "modules/dashboard/documentation" }
            properties: [
                { name: "enabled", value_boolean: true }
            ]
        }
        sort: [
             { properties: { name: "sort_order", order: ASC } }
        ]
    ) {
        total_entries
        total_pages
        per_page
        current_page
        has_next_page
        results {
            id
            updated_at
            created_at
            properties
            ## Images
            image: property_upload(name: "image") {
                url
                file_name
                extension
                versions
            }
        }
    }
}