---
metadata: {
    graphql_name: "refresh_secret"
}
---
# Purpose: Replaces a user's 2FA secret, so codes from the old authenticator entry stop working
# Used by: modules/dashboard/public/views/pages/api/account/2fa/disable_2fa.liquid
# Parameters:
#   - $user_id: User ID
# Returns: Refresh status
mutation refresh_secret($user_id: ID!) {
  user_otp_secret_refresh(user_id: $user_id) {
    status
  }
}
