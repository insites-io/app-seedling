---
metadata: {
    graphql_name: "configure_user_otp"
}
---
# Purpose: Updates user's 2FA configuration and session status
# Used by: modules/dashboard/public/views/pages/account/2fa.liquid (enable/disable 2FA)
# Parameters:
#   - $id: User ID
#   - $otp_configured: Boolean to enable/disable 2FA
#   - $is_currently_logged_in: Boolean to mark session as 2FA-verified
# Returns: Updated user with otp_configured status
# Note: deleted_at: null ensures profile exists even if previously soft-deleted
mutation configure_user_otp (
    $id: ID!,
    $otp_configured: Boolean,
    $is_currently_logged_in: Boolean
) {
    items: user_update (
    id: $id,
    user: {
        profiles: [
            {
                name: "modules/dashboard/client",
                values: {
                    deleted_at: null,
                    properties: [
                        { name: "otp_configured", value_boolean: $otp_configured }
                        { name: "is_currently_logged_in", value_boolean: $is_currently_logged_in}
                    ]
                }
            }
        ]
    }
    ) {
        id
        name
        email
        user_details: profiles(profile_type: "modules/dashboard/client") {
            otp_configured: property(name: "otp_configured")
        }
    }
}