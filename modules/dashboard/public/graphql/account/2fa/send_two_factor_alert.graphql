---
metadata: {
    graphql_name: "send_two_factor_alert"
}
---
# Purpose: Sends the "wrong security codes" alert email to a user
# Used by: modules/dashboard/public/views/partials/account/two_factor_lockout.liquid
# Parameters:
#   - $data: { to, reset_required } passed to the email template as data
# Returns: Whether the email was scheduled
mutation send_two_factor_alert($data: HashObject) {
  email_send(template: { name: "modules/dashboard/two_factor_alert" }, data: $data) {
    is_scheduled_to_send
  }
}
