---
metadata: {
    graphql_name: "log_last_login_date"
}
---
mutation log_last_login_date(
  $id: ID!
  $date: String!
){
  user_update(
    id: $id
    user: {
      profiles: [
        {
          name: "modules/insites_crm/administrator",
          values: { properties: [ { name: "last_login_date", value: $date } ] }
        }
      ]
    }
  ){
    id
    email
  }
}