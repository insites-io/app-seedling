---
metadata: {
    graphql_name: "create_session"
}
---
# Purpose: Creates a session variable to track 2FA verification state
# Used by: modules/dashboard/public/views/pages/account/2fa.liquid
# Parameters:
#   - $name: Session variable name (e.g., "two_factor_verified")
#   - $value: Session variable value (Any type)
# Returns: Success status
mutation create_session($name: String!, $value: Any!) {
    session_create_field(name: $name, value: $value)
}