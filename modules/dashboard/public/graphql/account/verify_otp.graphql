---
metadata: {
    graphql_name: "verify_otp"
}
---
# Purpose: Validates OTP code for 2FA authentication
# Used by: modules/dashboard/public/views/partials/account/2fa_functions/verify_otp/check.liquid
# Parameters:
#   - $email: User email address
#   - $otp_code: 6-digit OTP code from authenticator app
# Returns: User ID and email if OTP is valid (authenticate.otp_code returns true)
# Note: drift: 30 allows 30-second time window tolerance for clock skew
query verify_otp($email: String!, $otp_code: String!){
    users(
        filter: { email: { value: $email} }, per_page:1
    ){
        results{
        id
        email
        authenticate{
            otp_code(code: $otp_code, drift: 30)
        }
        }
    }
}
