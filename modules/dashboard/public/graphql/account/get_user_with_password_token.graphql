---
metadata: {
    graphql_name: "get_user_with_password_token"
}
---
# Purpose: Retrieves user with password reset token for validation
# Used by: modules/dashboard/public/views/pages/account/password_reset.liquid, forgot_password email
# Parameters:
#   - $email: User email (optional, for lookup)
#   - $id: User ID (optional, for lookup)
# Returns: User with password_token from token profile and verification_token from client profile
query get_user_with_password_token($email: String, $id: ID) {
  users(
    per_page:1
    filter: {
      email: {
        value: $email
      }
      id: {
        value: $id
      }
    }
  ) {
    results{
      id
      email
      first_name
      last_name
      default: profiles(profile_type: "modules/insites_crm/token") {
        password_token: property(name: "password_token")
      }
      client: profiles(profile_type: "modules/dashboard/client") {
        verification_token: property(name: "verification_token")
      }
    }
  }
}