---
metadata: {
    graphql_name: "delete_old_attempts"
}
---
# Purpose: Deletes attempts at one action that are older than the rate-limit window
# Used by: modules/dashboard/public/views/partials/account/rate_limit/allow.liquid
# Parameters:
#   - $action: Action name (sign_in, otp, forgot_password, email_check)
#   - $before: ISO date-time; only attempts created before it are deleted
# Returns: Number of records deleted
# Note: Attempts inside the window are never deleted, so the limits count the same.
#       Runs in the background (sync: false) so the request does not wait for it.
mutation delete_old_attempts($action: String!, $before: String!) {
  records_delete_all(
    table: "modules/dashboard/auth_attempt"
    filter: {
      created_at: { lt: $before }
      properties: [
        { name: "action", value: $action }
      ]
    }
  ) {
    count
  }
}
