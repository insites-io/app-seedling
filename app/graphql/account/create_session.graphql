---
metadata: {
    graphql_name: "create_session"
}
---
# Purpose: Creates a session variable (2FA verification state, the emailed sign-in form flag and link)
# Used by: app/views/pages/account/2fa.liquid and the emailed sign-in pages (sign_in_link*.liquid, sign_in_code*.liquid)
# Parameters:
#   - $name: Session variable name (e.g., "two_factor_user_id")
#   - $value: Session variable value (Any type)
# Returns: Success status
mutation create_session($name: String!, $value: Any!) {
    session_create_field(name: $name, value: $value)
}