---
metadata: {
    graphql_name: "generate_secret_key"
}
---
# Purpose: Generates OTP secret key and QR code for 2FA setup
# Used by: app/views/partials/account/setup_2fa.liquid
# Parameters:
#   - $email: User email (used as label in QR code)
#   - $issuer: Service name displayed in authenticator app
# Returns: OTP secret and its QR code SVG
query generate_secret_key (
    $email: String!, 
    $issuer: String!
) {
    items: users(
        filter: {
            email: {
                value: $email
            }
        }
        per_page: 1
        page: 1
    ){
        results{
            id
            email
            otp {
                secret_as_svg_qr_code(label: $email, issuer: $issuer)
                secret
            }
        }
    }
}