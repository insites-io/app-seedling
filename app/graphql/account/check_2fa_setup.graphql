---
metadata: {
    graphql_name: "check_2fa_setup"
}
---
# Purpose: Checks if current user has 2FA configured
# Used by: Authorization policies (is_user_allowed, allow_2fa_verification, is_2fa_activated, has_passed_2fa)
# Returns:
#   - otp_configured: Boolean indicating if 2FA is set up
#   - id: compared with context.session.two_factor_user_id to tell whether this session passed 2FA
{
    current_user {
        id
        name
        email
        client: profiles(profile_type: "client") {
            otp_configured: property_boolean(name: "otp_configured")
        }
    }
}