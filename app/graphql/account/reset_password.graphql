---
metadata: {
    graphql_name: "reset_password"
}
---
# Purpose: Sets a new password and clears the reset token so the link cannot be used again
# Used by: app/views/pages/account/password_reset_submit.liquid
# Parameters:
#   - $id: User ID
#   - $password: New password
# Returns: Updated user id
# Note: The platform also invalidates the temporary token when the password changes
mutation reset_password(
  $id: ID!
  $password: String!
) {
  user_update(
    id: $id
    user: {
      password: $password
      profiles: [
        {
          name: "modules/insites_crm/token",
          values: {
            properties: [
              { name: "password_token", value: "" }
            ]
          }
        }
      ]
    }
  ) {
    id
  }
}
