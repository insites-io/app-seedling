---
metadata: {
    graphql_name: "authenticate_password"
}
---
# Purpose: Checks an email and password pair for sign-in
# Used by: app/views/pages/account/sign_in_submit.liquid
# Parameters:
#   - $email: User email address
#   - $password: Plain text password to check against the stored one
# Returns: User id, whether the password matches, and whether 2FA is configured
query authenticate_password($email: String!, $password: String!) {
  users(
    per_page: 1
    filter: { email: { value: $email } }
  ) {
    results {
      id
      authenticate {
        password(password: $password)
      }
      client: profiles(profile_type: "client") {
        otp_configured: property_boolean(name: "otp_configured")
      }
    }
  }
}
