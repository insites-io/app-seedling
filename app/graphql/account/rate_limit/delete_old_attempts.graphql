---
metadata: {
    graphql_name: "delete_old_attempts"
}
---
# Purpose: Deletes attempts at one action that are older than the rate-limit window
# Used by: partials account/rate_limit/record.liquid, account/two_factor_lockout.liquid, account/two_factor_claim_code.liquid
# Parameters:
#   - $action: Action name (sign_in, otp, forgot_password, email_check, sign_in_link, sign_in_code, sign_in_code_check)
#   - $before: ISO date-time; only attempts created before it are deleted
#   - $sync: true to wait for the delete (default false: runs in the background)
# Returns: Number of records deleted
# Note: Attempts inside the window are never deleted, so the limits count the same.
#       Runs in the background by default so the request does not wait for it.
mutation delete_old_attempts($action: String!, $before: String!, $sync: Boolean = false) {
  records_delete_all(
    table: "auth_attempt"
    sync: $sync
    filter: {
      created_at: { lt: $before }
      properties: [
        { name: "action", value: $action }
      ]
    }
  ) {
    count
  }
}
