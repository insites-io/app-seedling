# Purpose: Deletes sign-in requests and their slots that are older than a cut-off
# Used by: app/views/pages/account/sign_in_code_request_submit.liquid, sign_in_link_request_submit.liquid
# Parameters:
#   - $table: sign_in_code or sign_in_link
#   - $before: ISO date-time; only records created before it are deleted
# Returns: Number of records deleted
# Note: Runs in the background. The cut-off is a day, far past the 15-minute lifetime of a request.
mutation delete_old_requests($table: String!, $before: String!) {
  records_delete_all(
    table: $table
    sync: false
    filter: { created_at: { lt: $before } }
  ) {
    count
  }
}
