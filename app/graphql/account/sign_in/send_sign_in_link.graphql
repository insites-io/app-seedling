# Purpose: Emails a sign-in link
# Used by: app/views/pages/account/sign_in_link_request_submit.liquid
# Parameters:
#   - $data: { to, link, minutes } passed to the email template as data
# Returns: Whether the email was scheduled
mutation send_sign_in_link($data: HashObject) {
  email_send(template: { name: "sign_in_link" }, data: $data) {
    is_scheduled_to_send
  }
}
