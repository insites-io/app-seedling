# Purpose: Emails a sign-in code
# Used by: app/views/pages/account/sign_in_code_request_submit.liquid
# Parameters:
#   - $data: { to, code, minutes } passed to the email template as data
# Returns: Whether the email was scheduled
mutation send_sign_in_code($data: HashObject) {
  email_send(template: { name: "sign_in_code" }, data: $data) {
    is_scheduled_to_send
  }
}
