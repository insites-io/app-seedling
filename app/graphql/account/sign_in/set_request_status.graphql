# Purpose: Moves one sign-in request from one status to another (pending to consumed, pending to killed)
# Used by: app/views/pages/account/sign_in_code_submit.liquid, sign_in_link_submit.liquid
# Parameters:
#   - $table: sign_in_code or sign_in_link
#   - $id: The request record id
#   - $from: The status the request must still have; any other status is left alone
#   - $to: The new status
# Returns: Number of records changed (0 or 1)
mutation set_request_status($table: String!, $id: ID!, $from: String!, $to: String!) {
  records_update_all(
    table: $table
    sync: true
    filter: {
      id: { value: $id }
      properties: [{ name: "status", value: $from }]
    }
    record: { properties: [{ name: "status", value: $to }] }
  ) {
    count
  }
}
