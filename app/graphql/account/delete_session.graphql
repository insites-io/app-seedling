---
metadata: {
    graphql_name: "delete_session"
}
---
# Purpose: Removes a session variable (e.g. the 2FA verification flag)
# Used by: app/views/pages/account/sign_in_submit.liquid, sign_in_link_submit.liquid, sign_in_code_submit.liquid, sign_out_submit.liquid, register_submit.liquid, profile_password_submit.liquid
# Parameters:
#   - $name: Session variable name (e.g., "two_factor_user_id")
# Returns: Success status
mutation delete_session($name: String!) {
    session_delete_field(name: $name)
}
