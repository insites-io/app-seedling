# Purpose: Sets a new password for the signed-in user
# Used by: app/views/pages/account/change_password_submit.liquid
# Parameters:
#   - $id: User ID. The caller passes the signed-in user's id, never one from the request
#   - $password: New password
# Returns: Updated user id, or errors
mutation change_password(
  $id: ID!
  $password: String!
) {
  user: user_update(
    id: $id
    user: {
      password: $password
    }
  ) {
    id
  }
}
