---
metadata: {
    graphql_name: "check_site_update_date"
}
---
# Purpose: Checks when site files (partials, layouts, pages, assets, forms) were last updated for cache invalidation
# Used by: app/views/partials/cache/generate_cache_key.liquid
# Returns: Most recent updated_at timestamp for each file type (per_page: 1, sorted DESC)
query check_site_update_date{
  admin_liquid_partials(
    per_page: 1
    sort: { updated_at: {order: DESC} }
  ){
    results{
      updated_at
      physical_file_path
    }
  }
  admin_liquid_layouts(
    per_page: 1
    sort: { updated_at: {order: DESC} }
  ){
    results{
      updated_at
      physical_file_path
    }
  }
  admin_pages(
    per_page: 1
    sort: { updated_at: {order: DESC} }
  ){
    results{
      updated_at
      physical_file_path
    }
  }
  admin_assets(
    per_page: 1
    sort: { updated_at: {order: DESC} }
  ){
    results{
      updated_at
      physical_file_path
    }
  }
  admin_forms(
    per_page: 1
    sort: { updated_at: {order: DESC} }
  ){
    results{
      updated_at
      physical_file_path
    }
  }
}